name: Push - run release verifications

concurrency:
  # group name unique for push to push-integ-test
  group: push-e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - chore/push-notifications-tests

jobs:
  # Runs only the Customer Profiles push notifications detox test instead of the
  # full release-verification matrix. The detox job is self-sufficient: it checks
  # out amplify-js, installs and builds it, sets up samples-staging and publishes
  # to Verdaccio itself, so the prebuild jobs (which only warm shared caches) are
  # not needed here.
  customer-profiles-push-notifications:
    secrets: inherit
    uses: ./.github/workflows/callable-e2e-test-detox.yml
    with:
      test_name: integ_rn_ios_push_notifications_customer_profiles
      working_directory: amplify-js-samples-staging/samples/react-native/push-notifications/CustomerProfilesPushApp
      timeout_minutes: 120
