buildscript {
	ext.getExtOrDefault = { name ->
		return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['AmplifyRtnPasskeys_' + name]
	}

	repositories {
		google()
		mavenCentral()
	}

	dependencies {
		classpath "com.android.tools.build:gradle:8.7.3"
		// noinspection DifferentKotlinGradleVersion
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
	}
}


apply plugin: "com.android.library"
// Android Gradle Plugin 9 ships built-in Kotlin support and applies the Kotlin
// plugin itself. Applying it a second time fails the configuration phase with
// "Cannot add extension with name 'kotlin'". Apply it only when AGP is not
// providing Kotlin: AGP 8 and older, or AGP 9 with android.builtInKotlin=false.
def shouldApplyKotlinPlugin() {
    def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
    if (agpMajor <= 8) {
        return true
    }
    // AGP 10 removes the opt-out: built-in Kotlin is always active there.
    if (agpMajor >= 10) {
        return false
    }
    def propertyVal = providers.gradleProperty("android.builtInKotlin").orNull
    def builtInKotlinEnabled = propertyVal != null ? propertyVal.toBoolean() : true
    return !builtInKotlinEnabled
}

if (shouldApplyKotlinPlugin()) {
    apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
	return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["AmplifyRtnPasskeys_" + name]).toInteger()
}


android {
	namespace "com.amazonaws.amplify.rtnpasskeys"

	compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

	defaultConfig {
		minSdkVersion getExtOrIntegerDefault("minSdkVersion")
		targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
	}

	buildFeatures {
		buildConfig true
	}

	buildTypes {
		release {
			minifyEnabled false
		}
	}

	lintOptions {
		disable "GradleCompatible"
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}

	sourceSets {
		main {
			java.srcDirs += [
				"generated/java",
				"generated/jni"
			]
		}
	}
}

repositories {
	mavenCentral()
	google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
	implementation "com.facebook.react:react-android"
	implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

	implementation "androidx.credentials:credentials:1.5.0"
	implementation "androidx.credentials:credentials-play-services-auth:1.5.0"

	testImplementation "junit:junit:4.13.2"
	testImplementation "org.robolectric:robolectric:4.14.1"
	testImplementation "io.mockk:mockk:1.14.2"
	testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
	testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
}

react {
	jsRootDir = file("../src/")
	libraryName = "AmplifyRtnPasskeys"
	codegenJavaPackageName = "com.amazonaws.amplify.rtnpasskeys"
}
